<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090a0f" />
    <meta name="description" content="Киноклуб Мелкомемья — каталог фильмов, честные оценки участников и совместные киновечера в стиле Netflix и Кинопоиска." />
    <title>Киноклуб Мелкомемья</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('cinemaclub_theme') || 'system';
          var isDark = stored === 'dark' || (stored === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', 'dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
            root.style.colorScheme = 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f4f6fa');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f4f6fa] dark:bg-[#090a0f] text-slate-900 dark:text-zinc-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
