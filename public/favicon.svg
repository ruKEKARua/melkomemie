<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Glow filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="neon-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Dark base background -->
  <rect width="64" height="64" rx="14" fill="#090a0f" />

  <!-- Top arch with Cat Screen -->
  <path d="M 22 20 Q 32 10 42 20 Z" fill="#13141f" stroke="#ef4444" stroke-width="1.2" />
  <circle cx="32" cy="18" r="7" fill="#161524" stroke="#f59e0b" stroke-width="1" />
  
  <!-- Pixel Cat Face in Top Badge -->
  <!-- Ears -->
  <rect x="28" y="13" width="2" height="2" fill="#fde047" />
  <rect x="34" y="13" width="2" height="2" fill="#fde047" />
  <!-- Head & Eyes -->
  <rect x="29" y="15" width="6" height="3" fill="#fde047" />
  <rect x="30" y="16" width="1" height="1" fill="#090a0f" />
  <rect x="33" y="16" width="1" height="1" fill="#090a0f" />
  <!-- Whiskers / Mouth -->
  <rect x="31" y="19" width="2" height="1" fill="#fde047" />

  <!-- Main Marquee Signboard -->
  <rect x="6" y="21" width="52" height="36" rx="8" fill="#13121d" stroke="url(#neon-border)" stroke-width="2" filter="url(#neon-glow)" />
  
  <!-- Inner bulb border -->
  <rect x="9" y="24" width="46" height="30" rx="5" fill="none" stroke="#78350f" stroke-width="1" stroke-dasharray="2 3" />
  
  <!-- "МЕЛКО" / "М" retro marquee letter -->
  <g fill="url(#amber-grad)" filter="url(#neon-glow)">
    <path d="M 18 29 L 22 29 L 26 39 L 27 39 L 31 29 L 35 29 L 35 44 L 31 44 L 31 34 L 27.5 42 L 25.5 42 L 22 34 L 22 44 L 18 44 Z" />
    <rect x="39" y="29" width="8" height="3" />
    <rect x="39" y="32" width="3" height="12" />
    <rect x="39" y="36.5" width="7" height="2.5" />
    <rect x="39" y="41.5" width="8" height="2.5" />
  </g>

  <!-- Bottom "КИНОКЛУБ" Pill badge -->
  <rect x="19" y="47" width="26" height="8" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="0.8" />
  <rect x="23" y="50" width="18" height="2" rx="1" fill="#ffffff" />
</svg>
